<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3e8e5">
<title>一門本部</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="/icon.jpeg" alt="一門アイコン">
    <div><div class="brand-title">一門本部</div><div class="brand-sub">信長の野望・真戦</div></div>
  </div>
  <button id="logoutBtn" class="ghost hidden">ログアウト</button>
</header>

<main class="wrap">
  <section id="loginView" class="card auth">
    <h1>🏯 一門本部へ</h1>
    <p class="muted">ゲーム名とパスワードでログイン</p>
    <input id="loginName" placeholder="ゲーム名" maxlength="30">
    <input id="loginPass" type="password" placeholder="パスワード（8文字以上）">
    <button id="loginBtn" class="primary">ログイン</button>
    <div id="loginMsg" class="msg"></div>
    <button id="showRegister" class="linkbtn">初めての方はこちら</button>
  </section>

  <section id="registerView" class="card auth hidden">
    <h1>🌸 一門員登録</h1>
    <p class="muted">ゲーム内の名前と、サイト用パスワードを登録</p>
    <input id="regName" placeholder="ゲーム名" maxlength="30">
    <input id="regPass" type="password" placeholder="パスワード（8文字以上）">
    <button id="registerBtn" class="primary">登録してログイン</button>
    <div id="regMsg" class="msg"></div>
    <button id="showLogin" class="linkbtn">ログイン画面へ</button>
  </section>

  <section id="appView" class="hidden">
    <div class="welcome card">
      <div><span class="small">ようこそ</span><h1 id="welcomeName">一門員</h1></div>
      <span id="roleBadge" class="badge">MEMBER</span>
    </div>

    <nav class="tabs">
      <button data-tab="home" class="active">🏠 ホーム</button>
      <button data-tab="schedule">📅 予定</button>
      <button data-tab="members">👥 メンバー</button>
      <button data-tab="units">⚔ 部隊登録</button>
      <button data-tab="progress">📊 育成状況</button>
      <button data-tab="guide">📖 攻略</button>
    </nav>

    <section id="tab-home" class="tab">
      <div class="section-head"><h2>🏠 一門ホーム</h2></div>
      <div class="grid2">
        <div class="card mini"><span>👥 登録メンバー</span><strong id="homeMembers">-</strong></div>
        <div class="card mini"><span>⚔ 部隊</span><strong id="homeUnits">-</strong></div>
      </div>
      <div class="card">
        <h3>📢 お知らせ</h3>
        <p class="muted">一門専用ポータル Ver.1 稼働中！</p>
      </div>
    </section>

    <section id="tab-schedule" class="tab hidden">
      <div class="section-head"><h2>📅 一門予定</h2><button id="addScheduleBtn" class="smallbtn hidden">＋追加</button></div>
      <div id="scheduleList"></div>
    </section>

    <section id="tab-members" class="tab hidden">
      <div class="section-head"><h2>👥 メンバー一覧</h2></div>
      <div id="memberList"></div>
    </section>

    <section id="tab-units" class="tab hidden">
      <div class="section-head"><h2>⚔ 自分の部隊</h2><span class="muted">Lv1〜50</span></div>
      <div id="myUnits"></div>
    </section>

    <section id="tab-progress" class="tab hidden">
      <div class="section-head"><h2>📊 育成進捗</h2></div>
      <div class="card">
        <p class="muted">他メンバーは閲覧のみ。自分の部隊だけ「部隊登録」から変更できます。</p>
      </div>
      <div id="progressList"></div>
    </section>

    <section id="tab-guide" class="tab hidden">
      <div class="section-head"><h2>📖 攻略情報</h2></div>
      <div class="card">
        <h3>準備中</h3>
        <p class="muted">ここに一門攻略記事を追加していきます。</p>
      </div>
    </section>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
